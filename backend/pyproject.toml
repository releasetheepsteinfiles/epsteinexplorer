[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "epsteinexplorer-backend"
version = "0.1.0"
description = "EpsteinExplorer — Backend API for natural language Epstein file research"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic-settings>=2.5.0",
    "sse-starlette>=2.0.0",
    "epsteinexposed>=0.2.0",
    "smolagents>=1.0.0",
    "litellm>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    # <0.16.0: see epsteinexposed's pyproject.toml for why — keeps local
    # installs from drifting past the version CI pins.
    "ruff>=0.8.0,<0.16.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["--strict-markers", "--strict-config"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
]

[tool.coverage.run]
source = ["app"]
omit = ["*/tests/*"]

[tool.hatch.build.targets.wheel]
packages = ["app", "agent"]
