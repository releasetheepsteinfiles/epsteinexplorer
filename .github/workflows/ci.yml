name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: Ruff check
        run: ruff check backend/ agent/
      - name: Ruff format
        run: ruff format --check backend/ agent/

  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: explorer
          POSTGRES_PASSWORD: explorer
          POSTGRES_DB: epsteinexplorer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U explorer"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://explorer:explorer@localhost:5432/epsteinexplorer_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Run tests
        working-directory: backend
        run: pytest -v --no-cov

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install & build
        working-directory: frontend
        run: npm ci && npm run build

  brand:
    name: Design tokens in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Guards the shared "Declassified" palette: frontend/src/brand.css and
      # docs/src/brand.css must match brand/tokens.css exactly. Drift across
      # the four repos is what this design system exists to prevent — see
      # brand/DESIGN.md.
      - name: Verify design tokens
        run: node brand/verify-tokens.mjs
